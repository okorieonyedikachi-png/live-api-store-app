<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Daily Outlet</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

  <!-- Top Header Bar -->
  <header class="navbar">
    <div class="logo">The Daily Outlet</div>
    <div class="cart-summary">
      <span>Cart: <strong id="cartCount">0</strong> items</span>
      <span class="divider">|</span>
      <span>Total: <strong id="cartTotal">$0.00</strong></span>
      <button id="viewCartBtn" class="btn btn-primary hidden">View Cart</button>
      <button id="viewOrdersBtn" class="btn btn-primary hidden">My Orders</button>
      <button id="openAuthBtn" class="btn-primary" style="white-space: nowrap; width: auto;">Account / Sign Up</button>
    </div>
  </header>

  <!-- Controls Container -->
  <main class="container">
    <div class="controls-wrapper">
      <!-- Search Input -->
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search products by title...">
      </div>

      <!-- Filter Buttons -->
      <div class="category-buttons" id="categoryContainer">
        <button class="filter-btn active" data-category="all">All Products</button>
        <button class="filter-btn" data-category="electronics">Electronics</button>
        <button class="filter-btn" data-category="jewelery">Jewelry</button>
        <button class="filter-btn" data-category="men's clothing">Men's Clothing</button>
        <button class="filter-btn" data-category="women's clothing">Women's Clothing</button>
      </div>
    </div>

        <!-- Order Tracking Section -->
    <div class="tracking-container" style="text-align: center; margin: 20px 0;">
      <input type="text" id="trackInput" placeholder="Enter Order ID (e.g., ORD-12345)" style="padding: 8px; width: 250px;" />
      <button id="trackBtn" style="padding: 8px 16px; background-color: #4CAF50; color: white; border: none; cursor: pointer;">Track Order</button>
      <div id="trackingResult" style="margin-top: 15px; font-weight: bold;"></div>
    </div>


    <!-- Loading Indicator -->
    <div id="loadingText" class="loading-state">
      <div class="spinner"></div>
      <p>Fetching store items...</p>
    </div>

    
    <!-- Product Grid -->
    <div id="productGrid" class="product-grid"></div>
  </main>

  <!-- Shopping Cart Modal Overlay -->
  <div id="cartModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h2>Your Shopping Cart</h2>
        <button id="closeCartBtn" class="close-btn">&times;</button>
      </div>
      <div id="cartItemsContainer" class="modal-body">
        <!-- Dynamic cart items load here -->
      </div>
      <div class="modal-footer">
        <div class="modal-total">
          <span>Total:</span>
          <span id="modalCartTotal">$0.00</span>
        </div>
        <div class="modal-actions" style="display: flex; flex-direction: row;gap: 10px; width: 100%; margin-top: 15px;">
          <button id="clearCartBtn" class="btn-secondary" style="flex: 1; padding: 10px;">Clear Cart</button>
          <button id="checkoutBtn" class="btn-primary" style="flex: 1; padding: 10px;">Checkout</button>
        </div>
      </div>
    </div>
  </div>

    <!-- Checkout Modal Overlay -->
  <div id="checkoutModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h2>Checkout Details</h2>
        <button id="closeCheckoutBtn" class="close-btn">&times;</button>
      </div>
      <form id="checkoutForm" class="modal-body">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" required placeholder="John Doe">
        </div>
        <div class="form-group">
          <label for="phoneNumber">Phone Number</label>
          <input type="tel" id="phoneNumber" required placeholder="+234 800 000 0000">
        </div>
        <div class="form-group" style="margin-bottom: 12px; text-align: left;">
          <label for="customerEmail" style="display: block; font-weight: bold; margin-bottom: 4px;">Email Address:</label>
          <input type="email" id="customerEmail" placeholder="yourname@example.com" required style="width: 100%; padding: 8px; box-sizing: border-box;" />
        </div>

        <div class="form-group">
          <label for="address">House Address</label>
          <textarea id="address" rows="3" required placeholder="123 Main Street, City"></textarea>
        </div>
        <div class="modal-actions" style="margin-top: 15px;">
          <button type="submit" class="btn-primary">Place Order</button>
        </div>
      </form>
    </div>
  </div>
<!-- Orders History Modal -->
<div id="ordersModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Order History & Status</h2>
      <span id="closeOrdersBtn" class="close-btn">&times;</span>
    </div>
    <div id="ordersList" class="modal-body">
      <!-- Dynamic list of orders will render here -->
    </div>
  </div>
</div>

<!-- Auth Modal (Signup / Login) -->
<div id="authModal" class="modal-overlay">
  <div class="modal-box" style="max-width: 400px; max-height: 85vh; overflow-y: auto; text-align: center;">
    <span id="closeAuthBtn" class="close-btn" style="float: right; cursor: pointer; font-size: 20px;">&times;</span>
    
    <h2 id="authTitle" style="margin-bottom: 20px;">Create an Account</h2>

    <!-- Signup Form -->
    <form id="signupForm" style="display: flex; flex-direction: column; gap: 12px; text-align: left;">
      <div class="form-group">
        <label for="signupName">Full Name</label>
        <input type="text" id="signupName" placeholder="John Doe" required style="width: 100%; padding: 8px; box-sizing: border-box;">
      </div>

      <div class="form-group">
        <label for="signupEmail">Email Address</label>
        <input type="email" id="signupEmail" placeholder="yourname@example.com" required style="width: 100%; padding: 8px; box-sizing: border-box;">
      </div>

      <div class="form-group">
        <label for="signupPhone">Phone Number</label>
        <input type="tel" id="signupPhone" placeholder="+234 800 000 0000" required style="width: 100%; padding: 8px; box-sizing: border-box;">
      </div>

      <div class="form-group">
        <label for="signupPassword">Password</label>
        <input 
        type="password" 
        id="signupPassword" 
        placeholder="At least 8 chars, 1 uppercase & 1 number" 
        minlength="8" 
        required 
        style="width: 100%; padding: 8px; box-sizing: border-box;"/>
        <p style="margin-top: 15px; text-align: center;">
        <span id="toggleMsg">Already have an account?</span> 
        <a href="#" id="toggleAuthMode" style="color: #007bff; text-decoration: underline;">Log In</a>
        </p>
      </div>


      <button type="submit" class="btn-primary" style="margin-top: 10px; padding: 10px; width: 100%;">Create Account</button>
    </form>

     <!-- Login Prompt at Bottom -->
    <p style="margin-top: 15px; font-size: 14px;">
      Have an account already? <a href="#" id="switchToLogin" style="color: #28a745; font-weight: bold; text-decoration: none;">Login</a>
    </p>


        <!-- Divider -->
    <div style="display: flex; align-items: center; margin: 20px 0; color: #777;">
      <hr style="flex: 1; border: 0; border-top: 1px solid #ccc;">
      <span style="padding: 0 10px; font-size: 12px; text-transform: uppercase;">or sign up with</span>
      <hr style="flex: 1; border: 0; border-top: 1px solid #ccc;">
    </div>

    <!-- Social Buttons Underneath -->
    <div class="social-auth-container" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
      <button type="button" class="btn-social google-btn" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="18" height="18">
        Sign up with Google
      </button>
      <button type="button" class="btn-social apple-btn" style="padding: 10px; border: 1px solid #ccc; border-radius: 4px; background: #000; color: #fff; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <img src="https://www.svgrepo.com/show/511330/apple.svg" alt="Apple" width="18" height="18" style="filter: invert(1);">
        Sign up with Apple
      </button>
    </div>

  </div>
</div>



  <!-- JavaScript Application Entry point -->
  <script type="module" src="main.js"></script>

</body>
</html>

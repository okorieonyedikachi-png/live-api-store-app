<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Daily Outlet</title>
    <style>
        /* Background Image Setup */
body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  background: url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1600&q=80') no-repeat center center fixed !important;
  background-size: cover !important;
  min-height: 100vh;
}

/* Semi-transparent overlay for readability */
main, #productGrid {
  background-color: rgba(255, 255, 255, 0.85) !important;
  border-radius: 12px;
  margin: 20px auto !important;
  padding: 20px !important;
  max-width: 1200px;
}

/* Header & Navigation Bar */
header, .top-bar {
  display: flex !important;
  justify-content: space-between !important;
  align-items: center !important;
  padding: 15px 30px !important;
  background-color: rgba(30, 41, 59, 0.95) !important;
  color: #ffffff !important;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3) !important;
}

header h1 {
  margin: 0 !important;
  color: #ffffff !important;
  font-size: 1.6rem !important;
}

/* Category Filter Buttons */
.category-filters, .filters {
  display: flex !important;
  justify-content: center !important;
  gap: 10px !important;
  margin: 20px 0 !important;
  flex-wrap: wrap !important;
}

.category-filters button, .filters button {
  background-color: #ffffff !important;
  border: 1px solid #cbd5e1 !important;
  padding: 8px 16px !important;
  border-radius: 20px !important;
  cursor: pointer !important;
  font-weight: 600 !important;
  transition: all 0.2s ease !important;
}

.category-filters button:hover, .filters button:hover {
  background-color: #007bff !important;
  color: #ffffff !important;
}

/* Modal Hide Fix */
.modal, #cartModal, #checkoutModal {
  display: none !important;
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  width: 100% !important;
  height: 100% !important;
  background-color: rgba(0, 0, 0, 0.6) !important;
  z-index: 9999 !important;
  justify-content: center !important;
  align-items: center !important;
}

.modal.active, .modal.show, #cartModal.open {
  display: flex !important;
}

</style>

</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>The Daily Outlet</h1>
        <div class="cart-summary">
            <span>Cart: <span id="cartCount">0</span> items | Total: $<span id="cartTotal">0.00</span></span>
            <button onclick="toggleCartModal()" style="margin-left: 10px; padding: 4px 8px; cursor: pointer;">View Cart</button>
        </div>
    </header>

    <!-- Search Input -->
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search products by title..." oninput="filterProducts()">
    </div>

    <!-- Filter Buttons -->
    <div class="category-buttons" style="text-align: center; margin-bottom: 20px;">
        <button onclick="fetchProductsByCategory('all')">All Products</button>
        <button onclick="fetchProductsByCategory('electronics')">Electronics</button>
        <button onclick="fetchProductsByCategory('jewelery')">Jewelry</button>
        <button onclick="fetchProductsByCategory(&quot;men's clothing&quot;)">Men's Clothing</button>
        <button onclick="fetchProductsByCategory(&quot;women's clothing&quot;)">Women's Clothing</button>
    </div>

    <!-- Loading Text -->
    <p id="loadingText">Sending waiter to fetch products...</p>

    <!-- Product Container -->
    <div id="productGrid" class="product-grid"></div>

    <!-- Shopping Cart Modal Overlay -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Your Shopping Cart</h2>
                <span class="close-btn" onclick="toggleCartModal()">&times;</span>
            </div>

            <div id="cartItemsList" class="cart-items-list">
                <p class="empty-cart-msg">Your cart is empty.</p>
            </div>

            <div class="modal-footer">
                <h3>Total: $<span id="modalCartTotal">0.00</span></h3>
                <div>
                    <button onclick="clearCart()" class="clear-btn">Clear Cart</button>
                    <button type="button" onclick="event.stopPropagation(); openCheckoutFromModal()" style="padding: 6px 12px;">Checkout</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Checkout Modal Overlay -->
    <div id="checkoutModal" class="modal">
        <div class="modal-content">
            <form id="checkoutForm" onsubmit="handleCheckout(event)" style="margin-top: 15px;">
                <div style="margin-bottom: 12px;">
                    <label for="userName" style="display: block; font-weight: bold; margin-bottom: 5px;">Full Name</label>
                    <input type="text" id="userName" required placeholder="John Doe" style="width: 100%; padding: 8px; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 12px;">
                    <label for="userEmail" style="display: block; font-weight: bold; margin-bottom: 5px;">Email Address</label>
                    <input type="email" id="userEmail" required placeholder="john@example.com" style="width: 100%; padding: 8px; box-sizing: border-box;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label for="userAddress" style="display: block; font-weight: bold; margin-bottom: 5px;">Shipping Address</label>
                    <textarea id="userAddress" required rows="3" placeholder="123 Street Name, City" style="width: 100%; padding: 8px; box-sizing: border-box;"></textarea>
                </div>

                <div class="modal-footer" style="padding-top: 10px;">
                    <button type="button" onclick="toggleCheckoutModal()" style="padding: 8px 15px; border: none; background-color: #ccc; cursor: pointer;">Cancel</button>
                    <button type="submit" style="padding: 8px 15px; border: none; background-color: #28a745; color: white; cursor: pointer;">Place Order</button>
                </div>
            </form>
        </div>
    </div>

        <!-- JavaScript Files -->
    <script type="module" src="api.js"></script>
    <script type="module" src="cart.js"></script>
    <script type="module" src="ui.js"></script>
    <script type="module" src="main.js"></script>

</body>
</html>
